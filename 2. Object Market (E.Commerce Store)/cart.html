<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — OBJECT MARKET</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a href="index.html" class="tb-logo">OBJECT<span>MARKET</span></a>
      <div class="tb-icons" style="margin-left:auto;">
        <a href="shop.html">Continue Shopping →</a>
      </div>
    </div>
  </header>

  <main class="wrap" style="padding: 40px 0 80px;">
    <div class="breadcrumb"><a href="index.html">Marketplace</a> &nbsp;/&nbsp; <span>Cart</span></div>
    
    <div class="shop-head" style="margin-bottom: 24px;">
      <h1>Shopping Cart</h1>
    </div>

    <div class="cart-grid">
      <!-- Full Cart List -->
      <div class="full-cart-list">
        <!-- Injected dynamically via script.js -->
      </div>

      <!-- Order Summary -->
      <div class="summary-box">
        <h3>Order Summary</h3>
        <div class="sum-row">
          <span>Subtotal</span>
          <span class="cart-subtotal">$0.00</span>
        </div>
        <div class="sum-row">
          <span>Standard Shipping</span>
          <span>$12.00</span>
        </div>
        <div class="sum-row total">
          <span>Estimated Total</span>
          <span class="cart-total">$0.00</span>
        </div>
        <div style="margin-top:24px;">
          <a href="checkout.html" class="btn btn-solid" style="width:100%; text-align:center;">Proceed to Checkout</a>
          <a href="shop.html" class="link" style="display:block; text-align:center; margin-top:14px;">Continue Shopping →</a>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
