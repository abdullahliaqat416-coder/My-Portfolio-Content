<!DOCTYPE html>

<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a href="index.html" class="tb-logo">OBJECT<span>MARKET</span></a>
      <div class="tb-search-container">
        <form action="search.html" method="GET" class="tb-search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" name="q" placeholder="Search objects, brands, categories..." autocomplete="off">
        </form>
      </div>
      <div class="tb-icons">
        <a href="account.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Account</a>
        <a href="wishlist.html" style="color:var(--cobalt);"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.4-9.5-8.8C.7 8.6 2.6 5 6 5c2 0 3.3 1 4 2.3C10.7 6 12 5 14 5c3.4 0 5.3 3.6 3.5 7.2C19 16.6 12 21 12 21z"/></svg>Wishlist</a>

      </div>
    </div>
  </header>

  <main class="wrap" style="padding: 40px 0 80px;">
    <div class="breadcrumb"><a href="index.html">Marketplace</a> &nbsp;/&nbsp; <span>Wishlist</span></div>
    
    <div class="shop-head" style="margin-bottom: 24px;">
      <h1>Saved Objects</h1>
    </div>

    <div class="pgrid" id="wishlist-grid">
      <div class="pcard" data-id="om-orbit-lamp" data-brand="Kiln &amp; Co" data-name="Orbit Desk Lamp" data-price="148" data-image="https://images.unsplash.com/photo-1524484485831-a92ffc0de03f?auto=format&fit=crop&w=600&q=80">
        <button class="pcard-wish active"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.4-9.5-8.8C.7 8.6 2.6 5 6 5c2 0 3.3 1 4 2.3C10.7 6 12 5 14 5c3.4 0 5.3 3.6 3.5 7.2C19 16.6 12 21 12 21z"/></svg></button>
        <div class="pcard-img"><a href="product.html?slug=orbit-desk-lamp"><img src="https://images.unsplash.com/photo-1524484485831-a92ffc0de03f?auto=format&fit=crop&w=600&q=80" alt="Orbit Desk Lamp"></a></div>
        <div class="pcard-brand">Kiln &amp; Co</div>
        <div class="pcard-name"><a href="product.html?slug=orbit-desk-lamp">Orbit Desk Lamp</a></div>
        <div class="pcard-bottom">
          <span class="pcard-price">$148</span>
          <button class="pcard-add" type="button">Add</button>
        </div>
      </div>

      <div class="pcard" data-id="om-mono-keyboard" data-brand="KeyLab" data-name="Mono Mechanical Keyboard" data-price="179" data-image="https://images.unsplash.com/photo-1587829741301-dc798b83add3?auto=format&fit=crop&w=600&q=80">

        <div class="pcard-brand">KeyLab</div>
        <div class="pcard-name"><a href="product.html?slug=mono-mechanical-keyboard">Mono Mechanical Keyboard</a></div>

          <button class="pcard-add" type="button">Add</button>
