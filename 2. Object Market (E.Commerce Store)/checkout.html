<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — OBJECT MARKET</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner" style="justify-content:center;">
      <a href="index.html" class="tb-logo">OBJECT<span>MARKET</span></a>
    </div>
  </header>

  <main class="wrap" style="padding: 40px 0 80px;">
    <div style="display:grid; grid-template-columns:1.4fr 1fr; gap:48px;" class="checkout-container">
      <!-- Left Column: Customer / Shipping / Payment Form -->
      <div>
        <h2 style="font-size:22px; font-weight:700; margin-bottom:24px;">Marketplace Checkout</h2>
        
        <form id="co-form" onsubmit="event.preventDefault(); alert('Order placed successfully! Thank you for purchasing from OBJECT MARKET.'); localStorage.removeItem('object_market_cart_v1'); window.location.href='index.html';">
          <div style="margin-bottom:28px;">
            <h4 style="font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); margin-bottom:12px;">1. Contact</h4>
            <div class="form-row single">
              <input type="email" placeholder="Email Address" required value="kaif@example.com">
            </div>
          </div>

          <div style="margin-bottom:28px;">
            <h4 style="font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); margin-bottom:12px;">2. Shipping Address</h4>
            <div class="form-row">
              <input type="text" placeholder="First Name" required value="Kaif">
              <input type="text" placeholder="Last Name" required value="Customer">
            </div>
            <div class="form-row single">
              <input type="text" placeholder="Street Address" required value="450 Architecture Blvd">
            </div>
            <div class="form-row">
              <input type="text" placeholder="City" required value="San Francisco">
              <input type="text" placeholder="Postal Code" required value="94103">
            </div>
          </div>

          <div style="margin-bottom:28px;">
            <h4 style="font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); margin-bottom:12px;">3. Payment</h4>
            <div class="form-row single">
              <input type="text" placeholder="Card Number" required value="•••• •••• •••• 1024">
            </div>
            <div class="form-row">
              <input type="text" placeholder="MM / YY" required value="09/28">
              <input type="text" placeholder="CVV" required value="789">
            </div>
          </div>

          <button type="submit" class="btn btn-solid" style="width:100%; padding:16px;">Place Order</button>
        </form>
      </div>

      <!-- Right Column: Order Summary -->
      <div>
        <div class="summary-box">
          <h3>Order Review</h3>
          <div id="co-items-list" style="margin-bottom:20px;">
            <!-- Populated via script -->
          </div>
          <div class="sum-row"><span>Subtotal</span><span id="co-sub">$148.00</span></div>
          <div class="sum-row"><span>Shipping</span><span>$12.00</span></div>
          <div class="sum-row total"><span>Total</span><span id="co-tot">$160.00</span></div>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const cart = JSON.parse(localStorage.getItem('object_market_cart_v1')) || [
        { brand: 'Kiln & Co', name: 'Orbit Desk Lamp', price: 148, qty: 1, image: 'https://images.unsplash.com/photo-1524484485831-a92ffc0de03f?auto=format&fit=crop&w=300&q=80' }
      ];
      const list = document.getElementById('co-items-list');
      const sub = document.getElementById('co-sub');
      const tot = document.getElementById('co-tot');

      if (list && cart.length > 0) {
        list.innerHTML = cart.map(item => `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; font-size:13px;">
            <div style="display:flex; align-items:center; gap:10px;">
              <img src="${item.image}" style="width:44px; height:44px; object-fit:cover; border:1px solid var(--line);">
              <div>
                <div style="font-weight:600;">${item.name}</div>
                <div style="font-size:11px; color:var(--muted);">${item.brand} × ${item.qty}</div>
              </div>
            </div>
            <div style="font-weight:700;">$${(item.price * item.qty).toFixed(2)}</div>
          </div>
        `).join('');

        const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
        const total = subtotal + 12;
        if (sub) sub.textContent = `$${subtotal.toFixed(2)}`;
        if (tot) tot.textContent = `$${total.toFixed(2)}`;
      }
    });
  </script>
</body>
</html>
